version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillproof-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./skillproof.db
      - LLM_PROVIDER=heuristic
      - PORT=8000
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend/skillproof.db:/app/skillproof.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillproof-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
